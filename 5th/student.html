<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Details</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;

    background:
        linear-gradient(
            rgba(15, 23, 42, 0.45),
            rgba(30, 41, 59, 0.45)
        ),
        url("https://img.magnific.com/premium-photo/banner-background-college-student-activities-day-theme-wide-copy-space_1231689-267.jpg?semt=ais_hybrid&w=740&q=80");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}


        .container {
    width: 520px;
    max-width: 95%;

    background: rgba(255, 255, 255, 0.96);

    padding: 40px;

    border-radius: 18px;

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.30);
}


        .icon {
            text-align: center;

            font-size: 50px;

            margin-bottom: 5px;
        }


        h1 {
            text-align: center;

            color: #172554;

            margin: 5px 0 10px;

            font-size: 30px;
        }


        .subtitle {
            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: block;

            color: #1e3a8a;

            font-weight: bold;

            font-size: 14px;

            margin-bottom: 7px;
        }


        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 7px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }


        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }


        .start-btn {
            width: 100%;

            margin-top: 10px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .start-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(37, 99, 235, 0.30);
        }


        .footer {
            text-align: center;

            margin-top: 20px;

            color: #94a3b8;

            font-size: 12px;
        }


        @media (max-width: 600px) {

            .container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="icon">
        🎓
    </div>


    <h1>
        Student Details
    </h1>


    <p class="subtitle">
        Enter your details to start the Internet Programming Quiz
    </p>


    <form action="quiz.html" method="get">


        <div class="form-group">

            <label for="name">
                Student Name
            </label>

            <input
                type="text"
                id="name"
                name="username"
                placeholder="Enter your name"
                required
            >

        </div>


        <div class="form-group">

            <label for="rollno">
                Roll Number
            </label>

            <input
                type="text"
                id="rollno"
                name="rollno"
                placeholder="Enter your roll number"
                required
            >

        </div>


        <div class="form-group">

            <label for="regno">
                Register Number
            </label>

            <input
                type="text"
                id="regno"
                name="regno"
                placeholder="Enter your register number"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email ID
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email ID"
                required
            >

        </div>


        <button
            type="submit"
            class="start-btn">

            Continue to Quiz

        </button>


    </form>


    <div class="footer">

        Internet Programming Online Examination

    </div>


</div>


</body>

</html>
