<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Internet Programming Quiz</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        linear-gradient(
            rgba(15, 23, 42, 0.65),
            rgba(15, 23, 42, 0.65)
        ),
        url("https://images.pexels.com/photos/9572568/pexels-photo-9572568.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
        .home {
            width: 650px;
            max-width: 90%;
            background: white;
            padding: 50px 40px;
            text-align: center;
            border-radius: 20px;
            box-shadow:
                0 15px 40px rgba(0,0,0,0.15);
        }
        .title-small {
            color: #2563eb;
            font-size: 14px;

            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 15px;
        }

        h1 {
            color: #172554;

            font-size: 36px;

            margin: 10px 0;
        }

        .description {
            color: #64748b;

            font-size: 16px;

            line-height: 1.6;

            margin: 20px 0 30px;
        }

        .info {
            display: flex;

            justify-content: center;

            gap: 20px;

            margin-bottom: 30px;

            flex-wrap: wrap;
        }

        .info-box {
            background: #eff6ff;

            padding: 15px 25px;

            border-radius: 10px;

            color: #1e3a8a;

            font-size: 14px;

            font-weight: bold;
        }

        .start-btn {
            display: inline-block;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            color: white;

            text-decoration: none;

            padding: 14px 45px;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            transition: 0.2s;
        }

        .start-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(37,99,235,0.3);
        }

        .footer {
            margin-top: 30px;

            color: #94a3b8;

            font-size: 12px;
        }

    </style>
</head>

<body>

<div class="home">

    <div class="title-small">
        ONLINE EXAMINATION
    </div>

    <h1>
        Internet Programming Quiz
    </h1>

    <p class="description">
        Test your knowledge of HTML, CSS, JavaScript
        and other Internet Programming concepts.
    </p>

    <div class="info">

        <div class="info-box">
            10 Questions
        </div>

        <div class="info-box">
            MCQ and Text
        </div>

        <div class="info-box">
            Online Test
        </div>

    </div>

    <a href="student.html" class="start-btn">
        Start Quiz
    </a>

    <div class="footer">
        Internet Programming Online Examination
    </div>

</div>

</body>
</html>
