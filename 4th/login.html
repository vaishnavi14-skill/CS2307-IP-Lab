<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobHunter - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}
body{
background:
linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url(login.avif);
background-size:cover;
background-position:center;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}
.login-box{
width:400px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}
h2{
text-align:center;
margin-bottom:20px;
color:#003366;
}
label{
font-weight:bold;
display:block;
margin-top:15px;
}
input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid gray;
border-radius:5px;
}
button{
width:100%;
padding:12px;
margin-top:25px;
background:#003366;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}
button:hover{
background:#0055aa;
}
.error{
color:red;
font-size:13px;
}
.register{
text-align:center;
margin-top:20px;
}
.register a{
text-decoration:none;
font-weight:bold;
color:#003366;
}
.register a:hover{
color:red;
}
</style>
</head>
<body>
<div class="login-box">
<h2>User Login</h2>
<form id="loginForm">
<label>Email</label>
<input
type="email"
id="email"
placeholder="Enter Registered Email">
<div
class="error"
id="emailError">
</div>
<label>Password</label>
<input
type="password"
id="password"
placeholder="Enter Password">
<div
class="error"
id="passwordError">
</div>
<button type="submit">
Login
</button>
</form>
<div class="register">
Don't have an account?
<a href="register.html">
Register Here
</a>
</div>
</div>
<script src="login.js"></script>
</body>
</html>
