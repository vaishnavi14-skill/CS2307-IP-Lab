<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Seeker Registration</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:url(register.avif) no-repeat center center fixed;
    background-size:cover;
    display:flex;
    justify-content:center;
    padding:30px;
}
.form-box{
    width:430px;
    background:rgba(255,255,255,0.93);
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}
.logo{
    text-align:center;
    margin-bottom:15px;
}
.logo img{
    width:100px;
    height:100px;
    border-radius:50%;   /* Optional: makes it circular */
}h2{
    text-align:center;
    color:#333;
}
label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}
input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}
input:focus,select:focus,textarea:focus{
    border-color:#2d6cdf;
    outline:none;
    box-shadow:0 0 6px rgba(45,108,223,.4);
}
.error{
    color:red;
    font-size:13px;
    margin-top:3px;
}
.buttons{
    display:flex;
    gap:10px;
}
button{
    flex:1;
    margin-top:20px;
    padding:10px;
    background:#2d6cdf;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
button:hover{
    background:#1e54b7;
}
.reset-btn{
    background:#666;
}
.reset-btn:hover{
    background:#444;
}
#successMsg{
    color:green;
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}
footer{
    margin-top:20px;
    text-align:center;
    font-size:13px;
}
</style>
</head>
<body>
<div class="form-box">
<div class="logo">
<img src="logo.png" alt="Logo">
</div>
<h2>Job Seeker Registration</h2>
<form id="registrationForm" novalidate>
<label>Full Name *</label>
<input type="text" id="fullName" placeholder="Enter your full name" maxlength="50">
<div class="error" id="fullNameError"></div>
<label>Email *</label>
<input type="text" id="email" placeholder="Enter your email">
<div class="error" id="emailError"></div>
<label>Phone Number *</label>
<input type="text" id="phone" placeholder="10 digit phone number">
<div class="error" id="phoneError"></div>
<label>Password *</label>
<input type="password" id="password" placeholder="At least 6 characters">
<div class="error" id="passwordError"></div>
<label>Gender</label>
<select id="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
<label>Date of Birth</label>
<input type="date" id="dob">
<label>Qualification</label>
<select id="qualification">
<option>B.E/B.Tech</option>
<option>B.Sc</option>
<option>MCA</option>
<option>Other</option>
</select>
<label>Desired Job Title *</label>
<input type="text" id="jobTitle" placeholder="Web Developer">
<div class="error" id="jobTitleError"></div>
<label>Years of Experience *</label>
<input type="number" id="experience">
<div class="error" id="experienceError"></div>
<label>Skills</label>
<textarea id="skills" rows="3" placeholder="HTML, CSS, JavaScript"></textarea>
<label>Linked In ID *</label>
<input type="text" id="resumeLink" placeholder="ID name.....">
<div class="error" id="resumeLinkError"></div>
<label>Upload Resume (PDF or DOC / DOCX)*</label>
<input type="file" id="resumeFile">
<div class="error" id="resumeFileError"></div>
<label>
<input type="checkbox" id="terms">
I agree to the Terms & Conditions
</label>
<div class="error" id="termsError"></div>
<div class="buttons">
<button type="submit">Register</button>
<button type="reset" class="reset-btn">Reset</button>
</div>
<div id="successMsg"></div>
</form>
<footer>
© 2026 CareerConnect Job Portal
</footer>
</div>
<script>
document.getElementById("registrationForm").addEventListener("submit",function(e){
e.preventDefault();
let isValid=true;
document.querySelectorAll(".error").forEach(function(x){
x.textContent="";
});
successMsg.textContent="";
const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const phonePattern=/^[0-9]{10}$/;
const urlPattern=/^(https?:\/\/)[^\s]+$/;
if(fullName.value.trim()==""){
fullNameError.textContent="Full name is required.";
isValid=false;
}
if(email.value.trim()==""){
emailError.textContent="Email is required.";
isValid=false;
}else if(!emailPattern.test(email.value.trim())){
emailError.textContent="Please enter a valid email.";
isValid=false;
}
if(phone.value.trim()==""){
phoneError.textContent="Phone number is required.";
isValid=false;
}else if(!phonePattern.test(phone.value.trim())){
phoneError.textContent="Enter a valid 10 digit phone number.";
isValid=false;
}
if(password.value==""){
passwordError.textContent="Password is required.";
isValid=false;
}else if(password.value.length<6){
passwordError.textContent="Password must be at least 6 characters.";
isValid=false;
}
if(jobTitle.value.trim()==""){
jobTitleError.textContent="Desired job title is required.";
isValid=false;
}
if(experience.value=="" || experience.value<0){
experienceError.textContent="Enter valid experience.";
isValid=false;
}
if(resumeLink.value.trim()==""){
resumeLinkError.textContent="LinkedIn ID  is required.";
isValid=false;
}
if(resumeFile.value==""){
resumeFileError.textContent="Please upload your resume.";
isValid=false;
}else{
const allowed=/(\.pdf|\.doc|\.docx)$/i;
if(!allowed.test(resumeFile.value)){
resumeFileError.textContent="Only PDF or DOC/DOCX files allowed.";
isValid=false;
}
}
if(!terms.checked){
termsError.textContent="Please accept Terms & Conditions.";
isValid=false;
}
if(isValid){
successMsg.textContent="Registration Successful!";
registrationForm.reset();
}
});
</script>
</body>
</html>
