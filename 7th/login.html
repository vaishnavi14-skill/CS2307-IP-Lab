<!DOCTYPE html>
<html>

<head>

    <title>Login - Session Tracking</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                rgba(0, 0, 0, 0.5),
                rgba(0, 0, 0, 0.5)
            ),
            url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 15px;

            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.4);

            text-align: center;
        }

        h2 {
            color: #263238;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #263238;
        }

        button {
            background-color: #263238;

            color: white;

            border: none;

            border-radius: 5px;

            padding: 10px 25px;

            font-size: 15px;

            cursor: pointer;
        }

        button:hover {
            background-color: #455a64;
        }

        #error {
            color: red;
            font-size: 14px;
            min-height: 20px;
        }

    </style>


    <script>

        function validateLogin() {

            var email =
                document.getElementById("email").value.trim();

            var password =
                document.getElementById("password").value;

            var error =
                document.getElementById("error");


            // Email Validation

            var emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (!emailPattern.test(email)) {

                error.innerHTML =
                    "Please enter a valid email address!";

                return false;
            }


            // Password Length

            if (password.length < 6) {

                error.innerHTML =
                    "Password must contain at least 6 characters!";

                return false;
            }


            // Uppercase Letter

            if (!/[A-Z]/.test(password)) {

                error.innerHTML =
                    "Password must contain one uppercase letter!";

                return false;
            }


            // Lowercase Letter

            if (!/[a-z]/.test(password)) {

                error.innerHTML =
                    "Password must contain one lowercase letter!";

                return false;
            }


            // Number

            if (!/[0-9]/.test(password)) {

                error.innerHTML =
                    "Password must contain at least one number!";

                return false;
            }


            // Validation Successful

            error.innerHTML = "";

            return true;
        }

    </script>

</head>


<body>

    <div class="login-box">

        <h2>Login</h2>

        <form action="WelcomeServlet"
              method="post"
              onsubmit="return validateLogin()">

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your Email"
                   required>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your Password"
                   required>

            <p id="error"></p>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
